<!DOCTYPE html>
<html lang="zh-CN" class="motion-on motion-prep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中华诗词地图 · 唐风宋韵 山河形胜</title>
<meta name="description" content="中国诗词地图：以青绿山水长卷串起唐宋诗词，点地标即可读诗，并看注释、赏析与写作背景。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a8322a'/%3E%3Ctext x='16' y='23' font-size='20' fill='%23fdf6e8' text-anchor='middle' font-family='serif'%3E%E8%AF%97%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<script>
/* 动效引导：系统「减弱动效」或用户上次选择关闭时，直接以静态呈现 */
(function () {
  try {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var saved = localStorage.getItem("poemmap:motion");
    var on = saved === null ? !reduce : saved === "1";
    var r = document.documentElement;
    r.className = on ? "motion-on motion-prep" : "motion-off";
  } catch (e) {
    document.documentElement.className = "motion-off";
  }
})();
</script>
</head>
<body>

<!-- ═══════════ 地图：全幅铺底 ═══════════ -->
<main id="map" aria-label="诗词地图"></main>
<div id="mapWash" aria-hidden="true"></div>

<!-- ═══════════ 长卷点景：远山 · 流云 · 仙鹤 · 松石 · 江涛 ═══════════ -->
<div id="paint" aria-hidden="true">
  <img class="p-mount"  src="assets/mountains-mist.png" alt="">
  <img class="p-cloud"  src="assets/cloud-blue.png" alt="">
  <img class="p-crane"  src="assets/crane.png" alt="">
  <img class="p-pine"   src="assets/pines.png" alt="">
  <img class="p-wave"   src="assets/waves.png" alt="">
</div>

<div id="atmosphere" aria-hidden="true"></div>

<!-- ═══════════ 左上：朱印 · 题名 · 小联 ═══════════ -->
<header id="brand">
  <span class="seal-big" aria-hidden="true">诗</span>
  <div class="b-text">
    <h1>中华诗词地图</h1>
    <p>唐风宋韵 · 山河形胜</p>
  </div>
  <div class="couplet" aria-hidden="true">
    <span class="cp-line">读万卷诗书</span>
    <span class="cp-line">行万里山河</span>
    <i class="cp-seal"></i>
  </div>
</header>

<!-- ═══════════ 右上：搜索 · 筛选 ═══════════ -->
<div id="tools">
  <div class="search" role="search">
    <svg class="i-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.4 15.4 L20.5 20.5"/></svg>
    <input id="q" type="search" placeholder="搜索诗词、诗人或地名" autocomplete="off" aria-label="搜索">
    <button id="qClear" class="q-clear" type="button" hidden aria-label="清空搜索">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <svg class="search-mark" viewBox="0 0 44 16" aria-hidden="true">
      <path d="M1 15 L9 6 L14 11 L21 3 L28 12 L34 7 L43 15 Z"/>
    </svg>
  </div>

  <div class="chipbar">
    <div class="chips" id="chipsDynasty" role="group" aria-label="按朝代筛选">
      <button type="button" data-val="全部" aria-pressed="true">全部</button>
      <button type="button" data-val="唐" aria-pressed="false">唐诗</button>
      <button type="button" data-val="宋" aria-pressed="false">宋词</button>
    </div>
    <span class="chip-sep" aria-hidden="true"></span>
    <div class="chips" id="chipsForm" role="group" aria-label="按体裁筛选">
      <button type="button" data-val="全部" aria-pressed="true">全部</button>
      <button type="button" data-val="诗" aria-pressed="false">诗</button>
      <button type="button" data-val="词" aria-pressed="false">词</button>
    </div>
    <span class="chip-fill"></span>
    <button id="menuBtn" class="round-btn" type="button" aria-label="更多" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
    </button>
  </div>
</div>

<!-- ═══════════ 左侧：篇目栏 ═══════════ -->
<aside id="sidebar" aria-label="篇目索引">
  <div class="side-head">
    <div class="counts">
      <b id="statPoems">0</b><i>首诗词</i>
      <b id="statPlaces">0</b><i>处地标</i>
    </div>
    <button id="shuffleBtn" class="shuffle" type="button" title="随机读一首">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 5v6h-6"/></svg>
      <span>换一批</span>
    </button>
  </div>

  <div class="tabs" id="tabs" role="group" aria-label="按朝代筛选">
    <button type="button" data-val="全部" aria-pressed="true">全部</button>
    <button type="button" data-val="唐" aria-pressed="false">唐诗</button>
    <button type="button" data-val="宋" aria-pressed="false">宋词</button>
  </div>

  <div class="side-list" id="list"></div>
</aside>

<!-- ═══════════ 中央：诗词卡 ═══════════ -->
<section id="card" aria-hidden="true" aria-live="polite">
  <button id="cardClose" class="card-close" type="button" aria-label="收起">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <span class="c-seal" aria-hidden="true">题</span>
  <header class="c-head">
    <h2 id="cardTitle"></h2>
    <p id="cardSub" class="c-sub"></p>
  </header>

  <div id="cardPoem" class="c-poem"></div>

  <div class="c-meta">
    <span class="c-place">
      <svg class="i-pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span id="cardPlace"></span>
    </span>
    <span id="cardTags" class="c-tags"></span>
  </div>

  <div class="c-rule" aria-hidden="true"></div>

  <section class="c-sec">
    <h3>诗意简析</h3>
    <p id="cardTr"></p>
  </section>

  <button id="cardMore" class="c-link" type="button">查看完整注解 <i>→</i></button>

  <div id="cardOthers" class="c-others" hidden></div>
</section>

<!-- ═══════════ 窄屏：篇目栏开关 ═══════════ -->
<button id="sideToggle" type="button" aria-label="篇目" aria-expanded="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  <span>篇目</span>
</button>

<!-- ═══════════ 左下：收录统计 ═══════════ -->
<div id="bottomBar">
  <span class="bs"><i class="seal-s">唐</i><em>诗</em><b id="cntTang">0</b></span>
  <span class="bs"><i class="seal-s">宋</i><em>词</em><b id="cntSong">0</b></span>
  <span class="bs-hint">点亮地标，读一首诗</span>
</div>

<!-- ═══════════ 右缘：竖排题词 · 罗盘 · 缩放 ═══════════ -->
<div id="sideVerse" aria-hidden="true">
  <span class="sv-line">诗在山河间</span>
  <span class="sv-line">山河亦成诗</span>
  <i class="sv-seal">诗</i>
</div>

<div id="compass" aria-hidden="true">
  <span class="c-label">北</span>
  <svg viewBox="0 0 26 26">
    <circle class="c-dial" cx="13" cy="13" r="10.4"/>
    <path class="c-needle-s" d="M13 23.2 L10.4 13 L13 14.6 L15.6 13 Z"/>
    <path class="c-needle-n" d="M13 2.8 L15.6 13 L13 11.4 L10.4 13 Z"/>
    <circle class="c-pin" cx="13" cy="13" r="1.6"/>
  </svg>
</div>

<div id="zoomer">
  <button id="zoomIn" type="button" aria-label="放大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zoomOut" type="button" aria-label="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
</div>

<!-- ═══════════ 详情：右侧滑出 ═══════════ -->
<aside id="detail" aria-hidden="true" aria-label="诗词详情">
  <button id="detailClose" class="panel-close" type="button" aria-label="关闭">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="detail-body">
    <header class="d-head">
      <h2 id="dTitle"></h2>
      <p id="dSub" class="d-sub"></p>
      <button id="btnMore" class="d-more" type="button" aria-expanded="false">
        <span>查看完整注释</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </header>

    <p id="dPrologue" class="d-prologue" hidden></p>
    <div id="dPoem" class="d-poem"></div>

    <div class="d-where">
      <svg class="i-pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <b id="dPlaceName"></b><span id="dPlaceRegion"></span>
    </div>
    <div id="dTags" class="d-tags"></div>

    <section class="sec">
      <h3>诗意简析</h3>
      <p id="dTr"></p>
    </section>

    <div id="dMore" class="d-more-body" hidden>
      <section class="sec">
        <h3>字词注释</h3>
        <dl id="dNotes" class="d-notes"></dl>
      </section>
      <section class="sec">
        <h3>赏析</h3>
        <p id="dAppr"></p>
      </section>
      <section class="sec" id="dOriginSec">
        <h3>写作背景</h3>
        <p id="dOrigin"></p>
      </section>
    </div>

    <section class="sec sec-author">
      <h3>作者</h3>
      <p id="dBio"></p>
    </section>
  </div>
</aside>

<!-- ═══════════ 侧栏面板：诗人 / 主题索引 ═══════════ -->
<aside id="panel" aria-hidden="true" aria-label="索引面板">
  <header class="panel-head">
    <h2 id="panelTitle">篇目</h2>
    <button id="panelClose" class="panel-close" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div id="panelBody" class="panel-body"></div>
</aside>

<!-- ═══════════ 菜单 ═══════════ -->
<div id="menuPop" class="menu-pop" hidden>
  <button type="button" data-act="poet">诗人索引 <i>54 位</i></button>
  <button type="button" data-act="theme">主题索引</button>
  <button type="button" data-act="motion">动效 <b id="motionState">开</b></button>
  <button type="button" data-act="reset">回到全国</button>
  <button type="button" data-act="about">关于本图</button>
</div>

<!-- ═══════════ 轻提示 ═══════════ -->
<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="data/authors.js"></script>
<script src="data/poems.tang.js"></script>
<script src="data/poems.song.js"></script>
<script src="data/tags.js"></script>
<script src="data/china.geo.js"></script>
<script src="data/geo-extras.js"></script>
<script src="js/terrain.js"></script>
<script src="js/mapimage.js"></script>
<script src="js/thumbs.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/motion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
